apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: paymentservice-network-delay
  namespace: online-boutique
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: paymentservice
  delay:
    latency: "200ms"
    correlation: "25"
    jitter: "50ms"
  duration: "60s"
