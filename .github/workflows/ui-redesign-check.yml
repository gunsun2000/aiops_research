name: UI Redesign Check

on:
  push:
    branches:
      - feat/ui-research-console-redesign
  pull_request:
    branches:
      - master
    paths:
      - 'ui/control_plane_static/**'
      - 'tests/test_control_plane_ui.py'
      - 'tests/test_complete_research_console_ui.py'
      - '.github/workflows/ui-redesign-check.yml'

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UI dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install -e ".[ui]"
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Run UI contract tests
        run: |
          python -m pytest tests/test_control_plane_ui.py tests/test_complete_research_console_ui.py -q
      - name: Check JavaScript syntax
        run: |
          node --check ui/control_plane_static/app.js
          node --check ui/control_plane_static/reference-ui.js
      - name: Start control plane
        env:
          AIOPS_REPO_ROOT: ${{ github.workspace }}
          AIOPS_BIND_ADDRESS: 127.0.0.1
          PORT: '18180'
        run: |
          nohup aiops-control-plane > /tmp/aiops-control-plane.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18180/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aiops-control-plane.log
          exit 1
      - name: Capture real UI screenshots
        run: |
          mkdir -p ui-preview
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No headless Chrome/Chromium found"
            exit 1
          fi
          FLAGS="--headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1672,941 --virtual-time-budget=4500"
          "$BROWSER" $FLAGS --screenshot=ui-preview/01-system-overview.png 'http://127.0.0.1:18180/#overview'
          "$BROWSER" $FLAGS --screenshot=ui-preview/02-recovery-experiment.png 'http://127.0.0.1:18180/#experiment'
          "$BROWSER" $FLAGS --screenshot=ui-preview/03-aiopslab-evaluation.png 'http://127.0.0.1:18180/?aiopslab_tab=evaluation#aiopslab'
          "$BROWSER" $FLAGS --screenshot=ui-preview/04-aiopslab-comparison.png 'http://127.0.0.1:18180/?aiopslab_tab=comparison#aiopslab'
          "$BROWSER" $FLAGS --screenshot=ui-preview/05-aiopslab-history.png 'http://127.0.0.1:18180/?aiopslab_tab=history#aiopslab'
          "$BROWSER" $FLAGS --screenshot=ui-preview/06-experiment-results.png 'http://127.0.0.1:18180/#analysis'
          "$BROWSER" $FLAGS --screenshot=ui-preview/07-experiment-detail.png 'http://127.0.0.1:18180/#history'
          ls -lh ui-preview
      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: ui-redesign-preview
          path: ui-preview/*.png
          if-no-files-found: error
