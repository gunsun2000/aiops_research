name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,autogen,ui]"

      - name: Run unit tests
        run: python -m pytest

      - name: Run Go guard tests
        run: |
          cd go/aiops-guard
          go test ./...

      - name: Check CLI entrypoint
        run: aiops-k8s-agents run --help
