[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-k8s-agents"
version = "0.1.0"
description = "로컬 우선 AIOps 4개 에이전트 Kubernetes 명령어 검증 프로토타입"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
autogen = [
  "autogen-agentchat>=0.4",
  "autogen-ext[openai]>=0.4",
  "pydantic>=2",
]
dev = [
  "pytest>=8.0",
]
docs = [
  "python-docx>=1.2",
]

[project.scripts]
aiops-k8s-agents = "aiops_k8s_agents.cli:main"
aiops-control-plane = "aiops_k8s_agents.control_plane_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
