[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-agent"
version = "0.1.0"
description = "Standalone Model Partition Orchestrator Agent for AI workload planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5,<2",
]
ui = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
orchestrator-agent = "orchestrator_agent.cli:main"
orchestrator-agent-api = "orchestrator_agent.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

